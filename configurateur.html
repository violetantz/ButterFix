<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ButterFix — Configurateur PC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e0c16; --panel:#140b30; --raise:#1c1045; --line:#37296b; --brand:#1f0063;
  --text:#f3f0fa; --mut:#a9a2c0; --violet:#6d3df0; --violet-t:#b8a4ff;
  --accent:#b8a4ff; --ok:#4ade80; --err:#ff8a8a;
  --display:'Bricolage Grotesque','Trebuchet MS',sans-serif;
  --body:'Figtree','Segoe UI',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--body);line-height:1.5;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header{display:flex;justify-content:space-between;align-items:center;max-width:1280px;margin:0 auto;padding:1.2rem 1.5rem}
.logo{font-family:var(--display);font-weight:800;font-size:1.4rem}
.logo span{color:var(--accent)}
a.logo{text-decoration:none;color:var(--text)}
.back{color:var(--mut);text-decoration:none;font-weight:600}
.back:hover{color:var(--text)}
.intro{max-width:1280px;margin:0 auto;padding:1rem 1.5rem 1.5rem}
h1{font-family:var(--display);font-weight:800;font-size:clamp(1.9rem,4.5vw,3.2rem);line-height:1.05;max-width:18ch}
.intro p{color:var(--mut);margin-top:.6rem;max-width:56ch}
main{max-width:1280px;margin:0 auto;padding:0 1.5rem 4rem;display:grid;grid-template-columns:1fr 380px;gap:1.5rem;align-items:start}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem}
.tab{padding:.5rem .9rem;border-radius:999px;border:1px solid var(--line);color:var(--mut);font-weight:600;font-size:.9rem;display:flex;gap:.5rem;align-items:center}
.tab:hover{border-color:var(--violet);color:var(--text)}
.tab[aria-current="true"]{background:var(--brand);border-color:var(--accent);color:#fff}
.tab i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.tab i.done{background:var(--ok)}
.tools{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.8rem}
.chip{padding:.3rem .7rem;border-radius:999px;border:1px solid var(--line);color:var(--mut);font-size:.82rem;font-weight:600}
.chip:hover{color:var(--text)}
.chip[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--accent)}
.tools input,.tools select{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:.35rem .7rem;font:inherit;font-size:.85rem}
.grp{font-family:var(--display);font-size:.95rem;color:var(--accent);margin:1rem 0 .1rem;padding-bottom:.3rem;border-bottom:1px solid var(--line)}
.grp:first-child{margin-top:0}
.vars{display:grid;gap:.4rem;margin:-.2rem 0 .4rem 1rem;padding-left:1rem;border-left:2px solid var(--violet)}
.var{display:flex;justify-content:space-between;align-items:center;gap:1rem;text-align:left;padding:.55rem .9rem;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:.9rem}
.var:hover{border-color:var(--violet)}
.var[aria-pressed="true"]{border-color:var(--accent);background:var(--raise)}
.var .l{display:flex;align-items:center}
.var img{width:32px;height:32px;object-fit:contain;margin-right:.6rem}
.var b{font-family:var(--display);white-space:nowrap}
.list{display:flex;flex-direction:column;gap:.6rem}
.card{display:flex;justify-content:space-between;align-items:center;gap:1rem;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.9rem 1.1rem}
.card:hover{border-color:var(--violet)}
.card[aria-pressed="true"]{border-color:var(--accent);background:var(--raise)}
.card .n{font-weight:700}
.card .s{color:var(--mut);font-size:.86rem}
.card .r{color:var(--err);font-size:.82rem;font-weight:600;margin-top:.15rem}
.card .p{font-family:var(--display);font-weight:800;font-size:1.2rem;white-space:nowrap}
.card img{width:52px;height:52px;object-fit:contain;border-radius:6px;margin-right:.9rem}
.card .l{display:flex;align-items:center}
aside{position:sticky;top:1rem;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:1.2rem;display:flex;flex-direction:column;gap:1.1rem}
svg.pc{width:100%;height:auto;background:var(--bg);border-radius:10px;border:1px solid var(--line)}
svg.pc .p{fill:none;stroke:var(--line);stroke-width:2;transition:fill .25s,stroke .25s}
svg.pc .p.on{fill:rgba(109,61,240,.6);stroke:var(--violet-t)}
.status{border-radius:10px;padding:.8rem 1rem;font-weight:600;font-size:.92rem;border:1px solid var(--line);background:var(--bg)}
.status.ok{border-color:var(--ok)} .status.bad{border-color:var(--err)}
.status b{display:block;margin-bottom:.2rem}
.status.ok b{color:var(--ok)} .status.bad b{color:var(--err)}
.status ul{list-style:none;font-weight:400;color:var(--mut);font-size:.88rem}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;padding:.45rem;font-weight:600;font-size:.85rem;color:var(--mut)}
.seg button[aria-pressed="true"]{background:var(--brand);color:#fff;box-shadow:inset 0 0 0 1px var(--accent)}
.meter .h{display:flex;justify-content:space-between;font-size:.9rem;margin:.7rem 0 .35rem}
.bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.bar div{height:100%;width:0;background:var(--violet);transition:width .4s}
.meter p{color:var(--mut);font-size:.85rem;margin-top:.4rem}
.build{list-style:none;font-size:.9rem;border-top:1px solid var(--line);padding-top:.8rem}
.build li{display:flex;justify-content:space-between;gap:.6rem;padding:.2rem 0}
.build li span:first-child{color:var(--mut);min-width:0;overflow-wrap:anywhere}
.build button{color:var(--mut);padding:0 .3rem}
.build button:hover{color:var(--err)}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:.9rem}
.total strong{font-family:var(--display);font-size:2rem;color:var(--accent)}
.share{background:var(--brand);color:#fff;border:1px solid var(--accent);font-weight:700;padding:.7rem;border-radius:8px}
.share:hover{background:#2c0b8a}
@media(max-width:900px){main{grid-template-columns:1fr}aside{position:static}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><a class="logo" href="./">Butter<span>Fix</span></a><a class="back" href="./">Accueil</a></header>
<section class="intro">
  <h1>Monte ton PC, pièce par pièce</h1>
  <p>Chaque choix est vérifié : socket, mémoire, format du boîtier, taille de la carte graphique et puissance de l’alimentation.</p>
</section>
<main>
  <section aria-label="Catalogue">
    <div class="tabs" id="tabs"></div>
    <div class="tools" id="tools"></div>
    <div class="list" id="list"></div>
  </section>
  <aside aria-label="Résumé de la configuration">
    <svg class="pc" viewBox="0 0 220 170" role="img" aria-label="Schéma des pièces choisies">
      <rect id="v-case" class="p" x="10" y="8" width="200" height="154" rx="8"/>
      <rect id="v-mb" class="p" x="24" y="20" width="100" height="100" rx="4"/>
      <rect id="v-cpu" class="p" x="48" y="36" width="30" height="30" rx="3"/>
      <circle id="v-cool" class="p" cx="63" cy="51" r="19"/>
      <rect id="v-ram" class="p" x="92" y="30" width="8" height="46" rx="2"/>
      <rect id="v-gpu" class="p" x="36" y="88" width="84" height="18" rx="3"/>
      <rect id="v-sto" class="p" x="140" y="24" width="56" height="16" rx="3"/>
      <rect id="v-psu" class="p" x="24" y="128" width="172" height="22" rx="3"/>
    </svg>
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <div>
      <div class="seg" role="group" aria-label="Résolution de jeu" id="res"></div>
      <div class="meter">
        <div class="h"><span>Goulot d’étranglement</span><strong id="bn-val">–</strong></div>
        <div class="bar"><div id="bn-bar"></div></div>
        <p id="bn-txt"></p>
      </div>
    </div>
    <div class="meter"><div class="h"><span>Consommation</span><strong id="pw">0 W</strong></div></div>
    <ul class="build" id="build"></ul>
    <div class="total"><span>Total estimé</span><strong id="total">0 €</strong></div>
    <button class="share" id="share">Copier le lien de ma config</button>
  </aside>
</main>

  if(cl&&cs&&cl.rad&&cs.rads.indexOf(cl.rad)<0)o.push({cats:['cool','case'],msg:'Radiateur '+cl.rad+' mm non pris en charge par ce boîtier'});
  if(ps&&cs&&ps.ptype&&cs.psu.indexOf(ps.ptype)<0)o.push({cats:['psu','case'],msg:'Ce boîtier n’accepte pas une alimentation '+ps.ptype});
  if(ps&&ps.cap<w)o.push({cats:['psu'],msg:'Alimentation de '+ps.cap+' W pour '+w+' W'});
  return o;
}
function warnings(st){
  var w=power(st),ps=st.psu,o=[];
  if(ps&&ps.cap>=w&&ps.cap<w*1.25)o.push('Alimentation juste : visez '+(Math.ceil(w*1.25/50)*50)+' W');
  return o;
}
function reason(cat,item){
  var t={};for(var k in S)t[k]=S[k];t[cat]=item;
  var p=problems(t);
  for(var i=0;i<p.length;i++){if(p[i].cats.indexOf(cat)>=0)return p[i].msg}
  return null;
}

// ---- Goulot d’étranglement : le CPU bride-t-il le GPU, selon la résolution ? ----
function bottleneck(){
  var c=S.cpu,g=S.gpu;
  if(!c||!g)return {v:null,txt:'Choisissez un processeur et une carte graphique.'};
  var cpuEff=c.s*RES[res],pct=cpuEff>=g.s?0:Math.round((1-cpuEff/g.s)*100);
  if(pct>=10)return {v:pct,txt:'Le processeur limite la carte graphique en '+res+'. Un CPU plus puissant débloquerait des images par seconde.'};
  if(cpuEff>g.s*1.6)return {v:0,txt:'Le processeur est largement au-dessus de la carte graphique : un GPU plus puissant serait mieux exploité.'};
  return {v:pct,txt:'Bon équilibre entre processeur et carte graphique en '+res+'.'};
}

// ---- Affichage ----
function drawTabs(){
  $('tabs').innerHTML='';
  CATS.forEach(function(c){
    var b=document.createElement('button');b.className='tab';
    b.setAttribute('aria-current',c.k===tab);
    b.innerHTML='<i class="'+(S[c.k]?'done':'')+'"></i>'+c.t;
    b.onclick=function(){tab=c.k;drawTabs();drawTools();drawList()};
    $('tabs').appendChild(b);
  });
}
function drawTools(){
  var bar=$('tools');bar.innerHTML='';q='';sortBy='';
  function row(list,all,cur,set){
    if(list.length<2)return;
    [all].concat(list).forEach(function(g){var b=document.createElement('button');b.className='chip';b.textContent=g;b.setAttribute('aria-pressed',cur===g);b.onclick=function(){set(g);drawTools();drawList()};bar.appendChild(b)});
    var br=document.createElement('span');br.style.flexBasis='100%';bar.appendChild(br);
  }
  var gs=[],g2=[],f=filt[tab]||'Tous';
  D[tab].forEach(function(it){var g=it.g||it.sock;if(g&&gs.indexOf(g)<0)gs.push(g);if(it.g2&&(f==='Tous'||g===f)&&g2.indexOf(it.g2)<0)g2.push(it.g2)});
  row(gs,'Tous',f,function(g){filt[tab]=g;filt2[tab]=null});
  row(g2,'Toutes',filt2[tab]||'Toutes',function(g){filt2[tab]=g});
  if(D[tab].length>8){
    var inp=document.createElement('input');inp.type='search';inp.placeholder='Rechercher';inp.setAttribute('aria-label','Rechercher une pièce');
    inp.oninput=function(){q=inp.value.toLowerCase();drawList()};bar.appendChild(inp);
    var sel=document.createElement('select');sel.setAttribute('aria-label','Trier');
    [['','Tri par défaut'],['pa','Prix croissant'],['pd','Prix décroissant'],['s','Performance']].forEach(function(o){var op=document.createElement('option');op.value=o[0];op.textContent=o[1];sel.appendChild(op)});
    sel.onchange=function(){sortBy=sel.value;drawList()};bar.appendChild(sel);
  }
}
function drawList(){
  var box=$('list');box.innerHTML='';
  var f=filt[tab]||'Tous',f2=filt2[tab]||'Toutes';
  var items=D[tab].filter(function(it){return(f==='Tous'||(it.g||it.sock)===f)&&(f2==='Toutes'||it.g2===f2)&&(it.n.toLowerCase().indexOf(q)>=0||(it.vs||[]).some(function(v){return v.n.toLowerCase().indexOf(q)>=0}))});
  if(sortBy==='pa')items.sort(function(a,b){return a.p-b.p});
  if(sortBy==='pd')items.sort(function(a,b){return b.p-a.p});
  if(sortBy==='s')items.sort(function(a,b){return(b.s||0)-(a.s||0)});
  if(!items.length)box.innerHTML='<p class="s" style="color:var(--mut)">Aucune pièce ne correspond.</p>';
  var lastH='';
  items.forEach(function(it){
    if(!sortBy){var hl=[f==='Tous'?(it.g||it.sock):null,it.g2].filter(Boolean).join(' · ');
      if(hl&&hl!==lastH){var h=document.createElement('h3');h.className='grp';h.textContent=hl;box.appendChild(h);lastH=hl}}
    var b=document.createElement('button'),why=reason(tab,it),vs=it.vs,cur=S[tab],on=cur&&(cur===it||cur.base===it.id);
    var price=vs?'dès '+fmt(Math.min.apply(null,vs.map(function(v){return v.p}))):fmt(it.p);
    b.className='card';b.setAttribute('aria-pressed',!!on);if(vs)b.setAttribute('aria-expanded',opened[tab]===it.id);
    b.innerHTML='<span class="l"><img src="'+(it.img||'images/'+slug(it.n)+'.webp')+'" alt="" loading="lazy" onerror="this.remove()"><span><span class="n">'+it.n+'</span><br><span class="s">'+it.sp+(vs?' · '+vs.length+' '+(it.vl||'marques')+' au choix':'')+'</span>'+(why?'<div class="r">Incompatible : '+why+'</div>':'')+'</span></span><span class="p">'+price+'</span>';
    b.onclick=function(){if(vs){opened[tab]=opened[tab]===it.id?null:it.id}else{S[tab]=(S[tab]===it)?null:it;update();drawTabs()}drawList()};
    box.appendChild(b);
    if(vs&&opened[tab]===it.id){
      var d=document.createElement('div');d.className='vars';
      vs.forEach(function(v){
        var vb=document.createElement('button');vb.className='var';vb.setAttribute('aria-pressed',S[tab]===v);
        vb.innerHTML='<span class="l"><img src="images/'+slug(v.n)+'.webp" alt="" loading="lazy" onerror="this.remove()">'+v.n+'</span><b>'+fmt(v.p)+'</b>';
        vb.onclick=function(){S[tab]=(S[tab]===v)?null:v;update();drawList();drawTabs()};d.appendChild(vb);
      });
      box.appendChild(d);
    }
  });
}
function update(){
  var total=0,w=power(S),keys=Object.keys(D),n=0;
  $('build').innerHTML='';
  CATS.forEach(function(c){
    var it=S[c.k];$('v-'+c.k).setAttribute('class','p'+(it?' on':''));
    if(!it)return;n++;total+=it.p;
    var li=document.createElement('li');
    li.innerHTML='<span>'+it.n+'</span><span>'+fmt(it.p)+' <button aria-label="Retirer '+it.n+'">✕</button></span>';
    li.querySelector('button').onclick=function(){S[c.k]=null;update();drawList();drawTabs()};
    $('build').appendChild(li);
  });
  $('total').textContent=fmt(total);$('pw').textContent=w+' W';
  var p=problems(S),wr=warnings(S),st=$('status');
  if(!n){st.className='status';st.innerHTML='<b>Aucune pièce choisie</b>Commencez par le processeur.'}
  else if(p.length){st.className='status bad';st.innerHTML='<b>'+p.length+' incompatibilité'+(p.length>1?'s':'')+'</b><ul>'+p.map(function(x){return '<li>'+x.msg+'</li>'}).join('')+'</ul>'}
  else{st.className='status ok';st.innerHTML='<b>Aucune incompatibilité</b>'+(wr.length?'<ul>'+wr.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul>':'')}
  var b=bottleneck();
  $('bn-val').textContent=b.v===null?'–':b.v+' %';$('bn-bar').style.width=(b.v||0)+'%';$('bn-txt').textContent=b.txt;
  var ids=CATS.map(function(c){return S[c.k]?S[c.k].id:''}).join(',');
  try{history.replaceState(null,'',n?'#b='+ids:location.pathname)}catch(e){}
}
function drawRes(){
  $('res').innerHTML='';
  Object.keys(RES).forEach(function(r){
    var b=document.createElement('button');b.textContent=r;b.setAttribute('aria-pressed',r===res);
    b.onclick=function(){res=r;drawRes();update()};$('res').appendChild(b);
  });
}
$('share').onclick=function(){
  var b=$('share');
  navigator.clipboard.writeText(location.href).then(function(){b.textContent='Lien copié'},function(){b.textContent='Copiez l’adresse de la page'});
  setTimeout(function(){b.textContent='Copier le lien de ma config'},2000);
};
// Charger une config depuis le lien
(function(){
  var m=location.hash.match(/b=([^&]*)/);if(!m)return;
  var ids=m[1].split(',');
  CATS.forEach(function(c,i){D[c.k].forEach(function(it){if(it.id===ids[i])S[c.k]=it;(it.vs||[]).forEach(function(v){if(v.id===ids[i])S[c.k]=v})})});
})();
drawRes();drawTabs();drawTools();drawList();update();
</script>

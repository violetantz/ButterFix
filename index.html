<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ButterFix — Visual PC Builder</title>
    <style>
        html {
            scroll-behavior: smooth;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #08080c;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Navbar */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 3rem;
            width: 100%;
            position: absolute;
            top: 0;
            z-index: 10;
            background: linear-gradient(to bottom, rgba(8,8,12,0.9), transparent);
        }

        .nav-logo {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #fff;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: #9ca3af;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: color 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .nav-links a:hover {
            color: #a855f7;
        }

        /* Hero */
        .hero {
            position: relative;
            width: 100%;
            height: 35vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background-image: url('logo.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(8, 8, 12, 0.5), #08080c);
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            margin-top: 5vh;
        }

        /* Layout 2 Colonnes */
        #configurateur {
            padding: 2rem 2rem 6rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .builder-grid {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 2rem;
            align-items: start;
        }

        /* Panneau Sélection Visuelle */
        .components-panel {
            background: rgba(15, 15, 25, 0.85);
            border: 1px solid #374151;
            padding: 2rem;
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        .category-section {
            margin-bottom: 2.5rem;
        }

        .category-title {
            color: #a855f7;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1.5px;
            margin-bottom: 1rem;
            padding-bottom: 0.4rem;
            border-bottom: 1px solid #374151;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1rem;
            max-height: 320px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .cards-grid::-webkit-scrollbar {
            width: 5px;
        }
        .cards-grid::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 3px;
        }

        .component-card {
            background: #08080c;
            border: 1px solid #1f2937;
            border-radius: 8px;
            padding: 0.8rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .component-card:hover {
            border-color: #a855f7;
            transform: translateY(-2px);
        }

        .component-card.selected {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.08);
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.3);
        }

        .component-card img {
            width: 60px;
            height: 60px;
            object-fit: contain;
            margin-bottom: 0.5rem;
        }

        .component-name {
            font-size: 0.8rem;
            font-weight: 600;
            color: #e5e7eb;
            margin-bottom: 0.4rem;
            line-height: 1.2;
        }

        .component-price {
            font-size: 0.9rem;
            font-weight: 800;
            color: #a855f7;
            margin-top: auto;
        }

        /* Aperçu et Panneau latéral */
        .preview-panel {
            position: sticky;
            top: 100px;
            background: rgba(15, 15, 25, 0.9);
            border: 1px solid #374151;
            border-radius: 12px;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .pc-case-preview {
            width: 100%;
            height: 200px;
            background: #000;
            border: 2px dashed #374151;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: inset 0 0 30px rgba(124, 58, 237, 0.15);
        }

        .pc-case-preview img {
            max-width: 85%;
            max-height: 85%;
            object-fit: contain;
        }

        .status-badge {
            padding: 0.75rem 1rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            text-align: center;
            text-transform: uppercase;
        }

        .status-ok {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border: 1px solid #10b981;
        }

        .status-error {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid #ef4444;
        }

        .metric-card {
            background: #08080c;
            padding: 0.85rem 1rem;
            border-radius: 6px;
            border: 1px solid #1f2937;
        }

        .metric-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #9ca3af;
            margin-bottom: 0.4rem;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: #1f2937;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #10b981, #a855f7);
            transition: width 0.4s ease;
        }

        .total-price-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #374151;
            padding-top: 1rem;
        }

        @media (max-width: 900px) {
            .builder-grid {
                grid-template-columns: 1fr;
            }
            .preview-panel {
                position: static;
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="nav-logo">ButterFix</a>
        <ul class="nav-links">
            <li><a href="#configurateur">Configurateur</a></li>
        </ul>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h1 style="font-size: 2rem; color: #fff; margin-bottom: 0.3rem;">CONFIGURATEUR VISUEL BUTTERFIX</h1>
            <p style="color: #9ca3af; font-size: 0.95rem;">#BUILDWITHUS — Sélectionnez vos composants</p>
        </div>
    </section>

    <section id="configurateur">
        <div class="builder-grid">
            
            <!-- CONTENEUR DU CATALOGUE -->
            <div class="components-panel" id="catalog-container"></div>

            <!-- APERÇU + STATS -->
            <div class="preview-panel">
                <div class="pc-case-preview">
                    <img id="case-visual" src="logo.jpg" alt="Aperçu PC">
                </div>

                <div id="compatibility-badge" class="status-badge status-ok">
                    ✓ Configuration Compatible (100%)
                </div>

                <div class="metric-card">
                    <div class="metric-header">
                        <span>Bottleneck (Goulot)</span>
                        <span id="bottleneck-val" style="color: #a855f7; font-weight: bold;">0%</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div id="bottleneck-bar" class="progress-bar-fill"></div>
                    </div>
                    <p id="bottleneck-desc" style="font-size: 0.72rem; color: #6b7280; margin-top: 0.4rem;">Sélectionnez un CPU et un GPU.</p>
                </div>

                <div class="metric-card">
                    <div class="metric-header">
                        <span>Consommation</span>
                        <span id="power-val" style="color: #fff; font-weight: bold;">0 W</span>
                    </div>
                </div>

                <div class="total-price-box">
                    <span style="color: #9ca3af; text-transform: uppercase; font-size: 0.85rem;">Total Estimé</span>
                    <span id="total-price" style="font-size: 1.8rem; font-weight: 800; color: #a855f7;">0 €</span>
                </div>
            </div>

        </div>
    </section>

    <!-- SCRIPT JS SÉCURISÉ -->
    <script>
        (function() {
            var defImg = "logo.jpg";

            var catalog = {
                cpus: {
                    title: "1. Processeur (CPU)",
                    items: [
                        { id: "c1", name: "Core i3-10100F", price: 75, power: 65, socket: "LGA1200", ramType: "DDR4", score: 35 },
                        { id: "c2", name: "Core i5-12400F", price: 130, power: 65, socket: "LGA1700", ramType: "DDR4", score: 55 },
                        { id: "c3", name: "Core i5-13600K", price: 290, power: 125, socket: "LGA1700", ramType: "DDR5", score: 82 },
                        { id: "c4", name: "Core i7-14700K", price: 410, power: 125, socket: "LGA1700", ramType: "DDR5", score: 92 },
                        { id: "c5", name: "Ryzen 5 3600", price: 85, power: 65, socket: "AM4", ramType: "DDR4", score: 45 },
                        { id: "c6", name: "Ryzen 5 5600X", price: 135, power: 65, socket: "AM4", ramType: "DDR4", score: 60 },
                        { id: "c7", name: "Ryzen 7 5800X3D", price: 280, power: 105, socket: "AM4", ramType: "DDR4", score: 85 },
                        { id: "c8", name: "Ryzen 7 7800X3D", price: 420, power: 120, socket: "AM5", ramType: "DDR5", score: 98 },
                        { id: "c9", name: "Ryzen 7 9800X3D", price: 490, power: 120, socket: "AM5", ramType: "DDR5", score: 100 }
                    ]
                },
                motherboards: {
                    title: "2. Carte Mère",
                    items: [
                        { id: "m1", name: "MSI B450 TOMAHAWK MAX", price: 95, power: 25, socket: "AM4", ramType: "DDR4" },
                        { id: "m2", name: "Gigabyte B550 AORUS ELITE", price: 130, power: 25, socket: "AM4", ramType: "DDR4" },
                        { id: "m3", name: "ASUS TUF B650-PLUS WIFI", price: 190, power: 30, socket: "AM5", ramType: "DDR5" },
                        { id: "m4", name: "ASUS PRIME H610M D4", price: 90, power: 20, socket: "LGA1700", ramType: "DDR4" },
                        { id: "m5", name: "MSI MAG Z790 TOMAHAWK", price: 260, power: 35, socket: "LGA1700", ramType: "DDR5" }
                    ]
                },
                gpus: {
                    title: "3. Carte Graphique (GPU)",
                    items: [
                        { id: "g1", name: "Nvidia GTX 1650 4GB", price: 150, power: 75, score: 20 },
                        { id: "g2", name: "Nvidia RTX 3060 12GB", price: 290, power: 170, score: 50 },
                        { id: "g3", name: "Nvidia RTX 4060 8GB", price: 330, power: 115, score: 62 },
                        { id: "g4", name: "Nvidia RTX 4070 Super", price: 650, power: 220, score: 85 },
                        { id: "g5", name: "Nvidia RTX 4090 24GB", price: 1850, power: 450, score: 100 },
                        { id: "g6", name: "AMD Radeon RX 7800 XT", price: 540, power: 263, score: 82 }
                    ]
                },
                rams: {
                    title: "4. Mémoire RAM",
                    items: [
                        { id: "r1", name: "16GB (2x8) DDR4 3200MHz", price: 52, power: 15, ramType: "DDR4" },
                        { id: "r2", name: "32GB (2x16) DDR4 3600MHz", price: 79, power: 15, ramType: "DDR4" },
                        { id: "r3", name: "32GB (2x16) DDR5 6000MHz", price: 125, power: 15, ramType: "DDR5" },
                        { id: "r4", name: "64GB (2x32) DDR5 6400MHz", price: 230, power: 20, ramType: "DDR5" }
                    ]
                },
                storages: {
                    title: "5. Stockage SSD & HDD",
                    items: [
                        { id: "s1", name: "SSD NVMe 500GB", price: 40, power: 5 },
                        { id: "s2", name: "Crucial P3 1TB NVMe", price: 70, power: 6 },
                        { id: "s3", name: "Samsung 990 PRO 2TB", price: 175, power: 8 },
                        { id: "s4", name: "Seagate Barracuda 4TB HDD", price: 95, power: 8 }
                    ]
                },
                coolings: {
                    title: "6. Refroidissement",
                    items: [
                        { id: "cl1", name: "Ventirad Standard", price: 25, power: 4 },
                        { id: "cl2", name: "Thermalright Assassin 120", price: 40, power: 5 },
                        { id: "cl3", name: "Watercooling AIO 240mm", price: 90, power: 15 },
                        { id: "cl4", name: "Watercooling AIO 360mm", price: 160, power: 20 }
                    ]
                },
                cases: {
                    title: "7. Boîtier PC",
                    items: [
                        { id: "cs1", name: "Micro-ATX Mini Tower", price: 75, power: 8 },
                        { id: "cs2", name: "NZXT H5 Flow RGB", price: 110, power: 10 },
                        { id: "cs3", name: "Corsair 4000D Airflow", price: 95, power: 10 },
                        { id: "cs4", name: "Lian Li O11 Dynamic EVO", price: 165, power: 15 }
                    ]
                },
                psus: {
                    title: "8. Alimentation (PSU)",
                    items: [
                        { id: "p1", name: "MSI MAG 650W Bronze", price: 70, capacity: 650 },
                        { id: "p2", name: "Corsair RM750e 750W Gold", price: 115, capacity: 750 },
                        { id: "p3", name: "Seasonic Focus 850W Gold", price: 145, capacity: 850 }
                    ]
                }
            };

            var selectedState = {
                cpus: null,
                motherboards: null,
                gpus: null,
                rams: null,
                storages: null,
                coolings: null,
                cases: null,
                psus: null
            };

            var container = document.getElementById('catalog-container');

            function renderCatalog() {
                container.innerHTML = '';

                Object.keys(catalog).forEach(function(catKey) {
                    var category = catalog[catKey];

                    var section = document.createElement('div');
                    section.className = 'category-section';

                    var title = document.createElement('div');
                    title.className = 'category-title';
                    title.innerHTML = category.title;
                    section.appendChild(title);

                    var grid = document.createElement('div');
                    grid.className = 'cards-grid';

                    category.items.forEach(function(item) {
                        var card = document.createElement('div');
                        card.className = 'component-card';

                        if (selectedState[catKey] === item) {
                            card.classList.add('selected');
                        }

                        card.innerHTML = 
                            '<img src="' + defImg + '" alt="' + item.name + '">' +
                            '<div class="component-name">' + item.name + '</div>' +
                            '<div class="component-price">' + item.price + ' €</div>';

                        card.onclick = function() {
                            if (selectedState[catKey] === item) {
                                selectedState[catKey] = null;
                            } else {
                                selectedState[catKey] = item;
                            }
                            renderCatalog();
                            updateBuildStats();
                        };

                        grid.appendChild(card);
                    });

                    section.appendChild(grid);
                    container.appendChild(section);
                });
            }

            function updateBuildStats() {
                var totalPrice = 0;
                var totalPower = 0;

                Object.keys(selectedState).forEach(key => {
                    var item = selectedState[key];
                    if (item) {
                        totalPrice += item.price;
                        if (item.power) totalPower += item.power;
                    }
                });

                document.getElementById('total-price').innerHTML = totalPrice + ' €';
                document.getElementById('power-val').innerHTML = totalPower + ' W';

                var badge = document.getElementById('compatibility-badge');
                var cpu = selectedState.cpus;
                var mb = selectedState.motherboards;
                var ram = selectedState.rams;
                var psu = selectedState.psus;

                var error = null;

                if (cpu && mb && cpu.socket !== mb.socket) {
                    error = 'Socket Incompatible (' + cpu.socket + ' vs ' + mb.socket + ')';
                } else if (mb && ram && mb.ramType !== ram.ramType) {
                    error = 'RAM Incompatible (' + mb.ramType + ' vs ' + ram.ramType + ')';
                } else if (psu && psu.capacity < totalPower) {
                    error = 'Alimentation insuffisante (' + psu.capacity + 'W pour ' + totalPower + 'W)';
                }

                if (error) {
                    badge.className = 'status-badge status-error';
                    badge.innerHTML = '❌ ' + error;
                } else {
                    badge.className = 'status-badge status-ok';
                    badge.innerHTML = '✓ Configuration Compatible (100%)';
                }

                var gpu = selectedState.gpus;
                var bBar = document.getElementById('bottleneck-bar');
                var bVal = document.getElementById('bottleneck-val');
                var bDesc = document.getElementById('bottleneck-desc');

                if (cpu && gpu) {
                    var diff = Math.abs(cpu.score - gpu.score);
                    var bPercent = Math.min(Math.round(diff), 100);

                    bBar.style.width = bPercent + '%';
                    bVal.innerHTML = bPercent + '%';

                    if (bPercent < 15) {
                        bDesc.innerHTML = 'Excellent équilibre entre le CPU et le GPU.';
                    } else if (cpu.score < gpu.score) {
                        bDesc.innerHTML = 'Le processeur bridera la carte graphique.';
                    } else {
                        bDesc.innerHTML = 'La carte graphique sera limitée par le CPU en haute résolution.';
                    }
                } else {
                    bBar.style.width = '0%';
                    bVal.innerHTML = '0%';
                    bDesc.innerHTML = 'Sélectionnez un CPU et un GPU.';
                }
            }

            renderCatalog();
        })();
    </script>
</body>
</html>

<html lang="fr">
<head>
    <meta charset="UTF-8">

    <title>ButterFix — Visual PC Builder Exhaustif & Intelligent</title>
    <style>
        html {
            scroll-behavior: smooth;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #08080c;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Navbar */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 3rem;
            width: 100%;
            position: absolute;
            top: 0;
            z-index: 10;
            background: linear-gradient(to bottom, rgba(8,8,12,0.9), transparent);
        }

        .nav-logo {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #fff;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: #9ca3af;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: color 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .nav-links a:hover {
            color: #a855f7;
        }

        /* Hero */
        .hero {
            position: relative;
            width: 100%;
            height: 35vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background-image: url('logo.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(8, 8, 12, 0.5), #08080c);
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            margin-top: 5vh;
        }

        /* Layout 2 Colonnes */
        #configurateur {
            padding: 2rem 2rem 6rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .builder-grid {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 2rem;
            align-items: start;
        }

        /* Panneau Sélection Visuelle */
        .components-panel {
            background: rgba(15, 15, 25, 0.85);
            border: 1px solid #374151;
            padding: 2rem;
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        .category-section {
            margin-bottom: 2.5rem;
        }

        .category-title {
            color: #a855f7;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1.5px;
            margin-bottom: 1rem;
            padding-bottom: 0.4rem;
            border-bottom: 1px solid #374151;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1rem;
            max-height: 350px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .cards-grid::-webkit-scrollbar {
            width: 5px;
        }
        .cards-grid::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 3px;
        }

        .component-card {
            background: #08080c;
            border: 1px solid #1f2937;
            border-radius: 8px;
            padding: 0.8rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .component-card:hover {
            border-color: #a855f7;
            transform: translateY(-2px);
        }

        .component-card.selected {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.08);
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.3);
        }

        .component-card img {
            width: 70px;
            height: 70px;
            object-fit: contain;
            margin-bottom: 0.6rem;
        }

        .component-name {
            font-size: 0.8rem;
            font-weight: 600;
            color: #e5e7eb;
            margin-bottom: 0.4rem;
            line-height: 1.2;
        }

        .component-price {
            font-size: 0.9rem;
            font-weight: 800;
            color: #a855f7;
            margin-top: auto;
        }

        .info-msg {
            color: #9ca3af;
            font-size: 0.85rem;
            font-style: italic;
            padding: 1rem;
            background: #08080c;
            border: 1px dashed #374151;
            border-radius: 6px;
            text-align: center;
            grid-column: 1 / -1;
        }

        /* Aperçu et Panneau latéral */
        .preview-panel {
            position: sticky;
            top: 100px;
            background: rgba(15, 15, 25, 0.9);
            border: 1px solid #374151;
            border-radius: 12px;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .pc-case-preview {
            width: 100%;
            height: 200px;
            background: #000;
            border: 2px dashed #374151;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: inset 0 0 30px rgba(124, 58, 237, 0.15);
        }

        .pc-case-preview img {
            max-width: 85%;
            max-height: 85%;
            object-fit: contain;
        }

        .status-badge {
            padding: 0.75rem 1rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            text-align: center;
            text-transform: uppercase;
        }

        .status-ok {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border: 1px solid #10b981;
        }

        .status-error {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid #ef4444;
        }

        .metric-card {
            background: #08080c;
            padding: 0.85rem 1rem;
            border-radius: 6px;
            border: 1px solid #1f2937;
        }

        .metric-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #9ca3af;
            margin-bottom: 0.4rem;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: #1f2937;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #10b981, #a855f7);
            transition: width 0.4s ease;
        }

        .total-price-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #374151;
            padding-top: 1rem;
        }

        @media (max-width: 900px) {
            .builder-grid {
                grid-template-columns: 1fr;
            }
            .preview-panel {
                position: static;
            }
        }
    </style>

                            itemsToDisplay = category.items.filter(function(mb) {
                                var matchSocket = mb.socket === selectedState.cpus.socket;
                                var matchRam = !selectedState.rams || mb.ramType === selectedState.rams.ramType;
                                return matchSocket && matchRam;
                            });

                            if (itemsToDisplay.length === 0) {
                                var msg = document.createElement('div');
                                msg.className = 'info-msg';
                                msg.innerHTML = '❌ Aucune carte mère compatible trouvée pour ce CPU / cette RAM.';
                                grid.appendChild(msg);
                                section.appendChild(grid);
                                container.appendChild(section);
                                return;
                            }
                        }
                    }

                    itemsToDisplay.forEach(function(item) {
                        var card = document.createElement('div');
                        card.className = 'component-card';

                        if (selectedState[catKey] === item) {
                            card.classList.add('selected');
                        }

                        card.innerHTML = 
                            '<img src="' + item.img + '" alt="' + item.name + '">' +
                            '<div class="component-name">' + item.name + '</div>' +
                            '<div class="component-price">' + item.price + ' €</div>';

                        card.onclick = function() {
                            if (selectedState[catKey] === item) {
                                selectedState[catKey] = null;
                            } else {
                                selectedState[catKey] = item;
                                // Si la carte mère sélectionnée n'est plus compatible suite à un changement, on la réinitialise
                                if (catKey === 'cpus' && selectedState.motherboards) {
                                    if (selectedState.motherboards.socket !== item.socket) {
                                        selectedState.motherboards = null;
                                    }
                                }
                                if (catKey === 'rams' && selectedState.motherboards) {
                                    if (selectedState.motherboards.ramType !== item.ramType) {
                                        selectedState.motherboards = null;
                                    }
                                }
                            }

                            renderCatalog();
                            updateBuildStats();
                        };

                        grid.appendChild(card);
                    });

                    section.appendChild(grid);
                    container.appendChild(section);
                });
            }

            function updateBuildStats() {
                var totalPrice = 0;
                var totalPower = 0;

                Object.keys(selectedState).forEach(key => {
                    var item = selectedState[key];
                    if (item) {
                        totalPrice += item.price;
                        if (item.power) totalPower += item.power;
                    }
                });

                document.getElementById('total-price').innerHTML = totalPrice + ' €';
                document.getElementById('power-val').innerHTML = totalPower + ' W';

                var badge = document.getElementById('compatibility-badge');
                var cpu = selectedState.cpus;
                var mb = selectedState.motherboards;
                var ram = selectedState.rams;
                var psu = selectedState.psus;

                var error = null;

                if (cpu && mb && cpu.socket !== mb.socket) {
                    error = 'Socket Incompatible (' + cpu.socket + ' vs ' + mb.socket + ')';
                } else if (mb && ram && mb.ramType !== ram.ramType) {
                    error = 'RAM Incompatible (' + mb.ramType + ' vs ' + ram.ramType + ')';
                } else if (psu && psu.capacity < totalPower) {
                    error = 'Alimentation insuffisante (' + psu.capacity + 'W pour ' + totalPower + 'W)';
                }

                if (error) {
                    badge.className = 'status-badge status-error';
                    badge.innerHTML = '❌ ' + error;
                } else {
                    badge.className = 'status-badge status-ok';
                    badge.innerHTML = '✓ Configuration Compatible (100%)';
                }

                var gpu = selectedState.gpus;
                var bBar = document.getElementById('bottleneck-bar');
                var bVal = document.getElementById('bottleneck-val');
                var bDesc = document.getElementById('bottleneck-desc');

                if (cpu && gpu) {
                    var diff = Math.abs(cpu.score - gpu.score);
                    var bPercent = Math.min(Math.round(diff), 100);

                    bBar.style.width = bPercent + '%';
                    bVal.innerHTML = bPercent + '%';

                    if (bPercent < 15) {
                        bDesc.innerHTML = 'Excellent équilibre entre le CPU et le GPU.';
                    } else if (cpu.score < gpu.score) {
                        bDesc.innerHTML = 'Le processeur bridera la carte graphique.';
                    } else {
                        bDesc.innerHTML = 'La carte graphique sera limitée par le CPU en haute résolution.';
                    }
                } else {
                    bBar.style.width = '0%';
                    bVal.innerHTML = '0%';
                    bDesc.innerHTML = 'Sélectionnez un CPU et un GPU.';
                }
            }

            // Initialisation
            renderCatalog();
        })();
    </script>
</body>
</html>

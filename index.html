<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ButterFix — Visual PC Builder</title>
    <style>
        html {
            scroll-behavior: smooth;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #08080c;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Navbar */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 3rem;
            width: 100%;
            position: absolute;
            top: 0;
            z-index: 10;
            background: linear-gradient(to bottom, rgba(8,8,12,0.9), transparent);
        }

        .nav-logo {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #fff;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: #9ca3af;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: color 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .nav-links a:hover {
            color: #a855f7;
        }

        /* Hero */
        .hero {
            position: relative;
            width: 100%;
            height: 35vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background-image: url('logo.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(8, 8, 12, 0.5), #08080c);
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            margin-top: 5vh;
        }

        /* Layout 2 Colonnes */
        #configurateur {
            padding: 2rem 2rem 6rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .builder-grid {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 2rem;
            align-items: start;
        }

        /* Panneau Sélection Visuelle */
        .components-panel {
            background: rgba(15, 15, 25, 0.85);
            border: 1px solid #374151;
            padding: 2rem;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            min-height: 400px;
        }

        .category-section {
            margin-bottom: 2.5rem;
        }

        .category-title {
            color: #a855f7;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1.5px;
            margin-bottom: 1rem;
            padding-bottom: 0.4rem;
            border-bottom: 1px solid #374151;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1rem;
            max-height: 320px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .cards-grid::-webkit-scrollbar {
            width: 5px;
        }
        .cards-grid::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 3px;
        }

        .component-card {
            background: #08080c;
            border: 1px solid #1f2937;
            border-radius: 8px;
            padding: 0.8rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .component-card:hover {
            border-color: #a855f7;
            transform: translateY(-2px);
        }

        .component-card.selected {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.08);
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.3);
        }

        .component-card img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 0.6rem;
            border: 1px solid #374151;
        }

        .component-name {
            font-size: 0.8rem;
            font-weight: 600;
            color: #e5e7eb;
            margin-bottom: 0.4rem;
            line-height: 1.2;
        }

        .component-price {
            font-size: 0.9rem;
            font-weight: 800;
            color: #a855f7;
            margin-top: auto;
        }

        .info-msg {
            color: #9ca3af;
            font-size: 0.85rem;
            font-style: italic;
            padding: 1.5rem;
            background: #08080c;
            border: 1px dashed #374151;
            border-radius: 6px;
            text-align: center;
            grid-column: 1 / -1;
        }

        /* Aperçu et Panneau latéral */
        .preview-panel {
            position: sticky;
            top: 100px;
            background: rgba(15, 15, 25, 0.9);
            border: 1px solid #374151;
            border-radius: 12px;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .pc-case-preview {
            width: 100%;
            height: 200px;
            background: #000;
            border: 2px dashed #374151;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: inset 0 0 30px rgba(124, 58, 237, 0.15);
        }

        .pc-case-preview img {
            max-width: 85%;
            max-height: 85%;
            object-fit: contain;
        }

        .status-badge {
            padding: 0.75rem 1rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            text-align: center;
            text-transform: uppercase;
        }

        .status-ok {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border: 1px solid #10b981;
        }

        .status-error {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid #ef4444;
        }

        .metric-card {
            background: #08080c;
            padding: 0.85rem 1rem;
            border-radius: 6px;
            border: 1px solid #1f2937;
        }

        .metric-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #9ca3af;
            margin-bottom: 0.4rem;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: #1f2937;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #10b981, #a855f7);
            transition: width 0.4s ease;
        }

        .total-price-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #374151;
            padding-top: 1rem;
        }

        @media (max-width: 900px) {
            .builder-grid {
                grid-template-columns: 1fr;
            }
            .preview-panel {
                position: static;
            }
        }
    </style>
</head>

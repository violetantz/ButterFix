<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ButterFix — Visual PC Builder Exhaustif</title>
    <style>
        html {
            scroll-behavior: smooth;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #08080c;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Navbar */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 3rem;
            width: 100%;
            position: absolute;
            top: 0;
            z-index: 10;
            background: linear-gradient(to bottom, rgba(8,8,12,0.9), transparent);
        }

        .nav-logo {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #fff;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: #9ca3af;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: color 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .nav-links a:hover {
            color: #a855f7;
        }

        /* Hero */
        .hero {
            position: relative;
            width: 100%;
            height: 35vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background-image: url('logo.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(8, 8, 12, 0.5), #08080c);
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            margin-top: 5vh;
        }

        /* Layout 2 Colonnes */
        #configurateur {
            padding: 2rem 2rem 6rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .builder-grid {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 2rem;
            align-items: start;
        }

        /* Panneau Sélection Visuelle */
        .components-panel {
            background: rgba(15, 15, 25, 0.85);
            border: 1px solid #374151;
            padding: 2rem;
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        .category-section {
            margin-bottom: 2.5rem;
        }

        .category-title {
            color: #a855f7;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1.5px;
            margin-bottom: 1rem;
            padding-bottom: 0.4rem;
            border-bottom: 1px solid #374151;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1rem;
            max-height: 320px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .cards-grid::-webkit-scrollbar {
            width: 5px;
        }
        .cards-grid::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 3px;
        }

        .component-card {
            background: #08080c;
            border: 1px solid #1f2937;
            border-radius: 8px;
            padding: 0.8rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .component-card:hover {
            border-color: #a855f7;
            transform: translateY(-2px);
        }

        .component-card.selected {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.08);
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.3);
        }

        .component-card img {
            width: 60px;
            height: 60px;
            object-fit: contain;
            margin-bottom: 0.6rem;
            filter: drop-shadow(0 0 8px rgba(168, 85, 247, 0.4));
        }

        .component-name {
            font-size: 0.8rem;
            font-weight: 600;
            color: #e5e7eb;
            margin-bottom: 0.4rem;
            line-height: 1.2;
        }

        .component-price {
            font-size: 0.9rem;
            font-weight: 800;
            color: #a855f7;
            margin-top: auto;
        }

        .info-msg {
            color: #9ca3af;
            font-size: 0.85rem;
            font-style: italic;
            padding: 1.5rem;
            background: #08080c;
            border: 1px dashed #374151;
            border-radius: 6px;
            text-align: center;
            grid-column: 1 / -1;
        }

        /* Aperçu et Panneau latéral */
        .preview-panel {
            position: sticky;
            top: 100px;
            background: rgba(15, 15, 25, 0.9);
            border: 1px solid #374151;
            border-radius: 12px;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .pc-case-preview {
            width: 100%;
            height: 200px;
            background: #000;
            border: 2px dashed #374151;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: inset 0 0 30px rgba(124, 58, 237, 0.15);
        }

        .pc-case-preview img {
            max-width: 85%;
            max-height: 85%;
            object-fit: contain;
        }

        .status-badge {
            padding: 0.75rem 1rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            text-align: center;
            text-transform: uppercase;
        }

        .status-ok {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border: 1px solid #10b981;
        }

        .status-error {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid #ef4444;
        }

        .metric-card {
            background: #08080c;
            padding: 0.85rem 1rem;
            border-radius: 6px;
            border: 1px solid #1f2937;
        }

        .metric-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #9ca3af;
            margin-bottom: 0.4rem;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: #1f2937;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #10b981, #a855f7);
            transition: width 0.4s ease;
        }

        .total-price-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #374151;
            padding-top: 1rem;
        }

        @media (max-width: 900px) {
            .builder-grid {
                grid-template-columns: 1fr;
            }
            .preview-panel {
                position: static;
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="nav-logo">ButterFix</a>

    <section class="hero">
        <div class="hero-content">

        </div>
    </section>

            var iconCooling = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%2306b6d4" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6 3"/></svg>';
            var iconCase = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%238b5cf6" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M4 16h16M9 6h6"/></svg>';
            var iconPsu = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%23eab308" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 12h2M10 12h8M6 9v6"/></svg>';

            var cpusData = [
                { id: "c1", name: "Core i3-10100F", price: 75, power: 65, socket: "LGA1200", ramType: "DDR4", score: 35, img: iconCpu },
                { id: "c2", name: "Core i5-12400F", price: 130, power: 65, socket: "LGA1700", ramType: "DDR4", score: 55, img: iconCpu },
                { id: "c3", name: "Core i5-13600K", price: 290, power: 125, socket: "LGA1700", ramType: "DDR5", score: 82, img: iconCpu },
                { id: "c4", name: "Core i7-14700K", price: 410, power: 125, socket: "LGA1700", ramType: "DDR5", score: 92, img: iconCpu },
                { id: "c5", name: "Ryzen 5 3600", price: 85, power: 65, socket: "AM4", ramType: "DDR4", score: 45, img: iconCpu },
                { id: "c6", name: "Ryzen 5 5600X", price: 135, power: 65, socket: "AM4", ramType: "DDR4", score: 60, img: iconCpu },
                { id: "c7", name: "Ryzen 7 5800X3D", price: 280, power: 105, socket: "AM4", ramType: "DDR4", score: 85, img: iconCpu },
                { id: "c8", name: "Ryzen 7 7800X3D", price: 420, power: 120, socket: "AM5", ramType: "DDR5", score: 98, img: iconCpu },
                { id: "c9", name: "Ryzen 7 9800X3D", price: 490, power: 120, socket: "AM5", ramType: "DDR5", score: 100, img: iconCpu }
            ];

            var motherboardsData = [
                { id: "m1", name: "MSI B450 TOMAHAWK MAX", price: 95, power: 25, socket: "AM4", ramType: "DDR4", img: iconMb },
                { id: "m2", name: "Gigabyte B550 AORUS ELITE", price: 130, power: 25, socket: "AM4", ramType: "DDR4", img: iconMb },
                { id: "m3", name: "ASUS TUF B650-PLUS WIFI", price: 190, power: 30, socket: "AM5", ramType: "DDR5", img: iconMb },
                { id: "m4", name: "ASUS PRIME H610M D4", price: 90, power: 20, socket: "LGA1700", ramType: "DDR4", img: iconMb },
                { id: "m5", name: "MSI MAG Z790 TOMAHAWK", price: 260, power: 35, socket: "LGA1700", ramType: "DDR5", img: iconMb }
            ];

            var gpusData = [
                { id: "g1", name: "Nvidia GTX 1650 4GB", price: 150, power: 75, score: 20, img: iconGpu },
                { id: "g2", name: "Nvidia RTX 3060 12GB", price: 290, power: 170, score: 50, img: iconGpu },
                { id: "g3", name: "Nvidia RTX 4060 8GB", price: 330, power: 115, score: 62, img: iconGpu },
                { id: "g4", name: "Nvidia RTX 4070 Super", price: 650, power: 220, score: 85, img: iconGpu },
                { id: "g5", name: "Nvidia RTX 4090 24GB", price: 1850, power: 450, score: 100, img: iconGpu },
                { id: "g6", name: "AMD Radeon RX 7800 XT", price: 540, power: 263, score: 82, img: iconGpu }
            ];

            var ramsData = [
                { id: "r1", name: "16GB (2x8) DDR4 3200MHz", price: 52, power: 15, ramType: "DDR4", img: iconRam },
                { id: "r2", name: "32GB (2x16) DDR4 3600MHz", price: 79, power: 15, ramType: "DDR4", img: iconRam },
                { id: "r3", name: "32GB (2x16) DDR5 6000MHz", price: 125, power: 15, ramType: "DDR5", img: iconRam },
                { id: "r4", name: "64GB (2x32) DDR5 6400MHz", price: 230, power: 20, ramType: "DDR5", img: iconRam }
            ];

            var storagesData = [
                { id: "s1", name: "SSD NVMe 500GB", price: 40, power: 5, img: iconStorage },
                { id: "s2", name: "Crucial P3 1TB NVMe", price: 70, power: 6, img: iconStorage },
                { id: "s3", name: "Samsung 990 PRO 2TB", price: 175, power: 8, img: iconStorage },
                { id: "s4", name: "Seagate Barracuda 4TB HDD", price: 95, power: 8, img: iconStorage }
            ];

            var coolingsData = [
                { id: "cl1", name: "Ventirad Standard", price: 25, power: 4, img: iconCooling },
                { id: "cl2", name: "Thermalright Assassin 120", price: 40, power: 5, img: iconCooling },
                { id: "cl3", name: "Watercooling AIO 240mm", price: 90, power: 15, img: iconCooling },
                { id: "cl4", name: "Watercooling AIO 360mm", price: 160, power: 20, img: iconCooling }
            ];

            var casesData = [
                { id: "cs1", name: "Micro-ATX Mini Tower", price: 75, power: 8, img: iconCase },
                { id: "cs2", name: "NZXT H5 Flow RGB", price: 110, power: 10, img: iconCase },
                { id: "cs3", name: "Corsair 4000D Airflow", price: 95, power: 10, img: iconCase },
                { id: "cs4", name: "Lian Li O11 Dynamic EVO", price: 165, power: 15, img: iconCase }
            ];

            var psusData = [
                { id: "p1", name: "MSI MAG 650W Bronze", price: 70, capacity: 650, img: iconPsu },
                { id: "p2", name: "Corsair RM750e 750W Gold", price: 115, capacity: 750, img: iconPsu },
                { id: "p3", name: "Seasonic Focus 850W Gold", price: 145, capacity: 850, img: iconPsu }
            ];

            var selectedState = {
                cpu: null,
                motherboard: null,
                gpu: null,
                ram: null,
                storage: null,
                cooling: null,
                pcCase: null,
                psu: null
            };

            function render() {
                var container = document.getElementById('catalog-container');
                if (!container) return;
                container.innerHTML = '';

                function createSection(titleText, items, categoryKey) {
                    var section = document.createElement('div');
                    section.className = 'category-section';

                    var title = document.createElement('div');
                    title.className = 'category-title';
                    title.textContent = titleText;
                    section.appendChild(title);

                    var grid = document.createElement('div');
                    grid.className = 'cards-grid';

                    // Filtrage intelligent des cartes mères selon le CPU
                    if (categoryKey === 'motherboard') {
                        if (!selectedState.cpu) {
                            var msg = document.createElement('div');
                            msg.className = 'info-msg';
                            msg.textContent = '⚠️ Veuillez d’abord sélectionner un Processeur (CPU) pour afficher les cartes mères compatibles.';
                            grid.appendChild(msg);
                            section.appendChild(grid);
                            container.appendChild(section);
                            return;
                        } else {
                            items = items.filter(function(mb) {
                                return mb.socket === selectedState.cpu.socket;
                            });
                            if (items.length === 0) {
                                var msg = document.createElement('div');
                                msg.className = 'info-msg';
                                msg.textContent = '❌ Aucune carte mère compatible pour le socket ' + selectedState.cpu.socket;
                                grid.appendChild(msg);
                                section.appendChild(grid);
                                container.appendChild(section);
                                return;
                            }
                        }
                    }

                    for (var i = 0; i < items.length; i++) {
                        var item = items[i];
                        var card = document.createElement('div');
                        card.className = 'component-card';

                        if (selectedState[categoryKey] === item) {
                            card.classList.add('selected');
                        }

                        card.innerHTML = 
                            '<img src="' + item.img + '" alt="' + item.name + '">' +
                            '<div class="component-name">' + item.name + '</div>' +
                            '<div class="component-price">' + item.price + ' €</div>';

                        (function(cat, itm) {
                            card.onclick = function() {
                                if (selectedState[cat] === itm) {
                                    selectedState[cat] = null;

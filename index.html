<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ButterFix — Le comparateur de prix & Configurateur PC</title>
    <style>
        html {
            scroll-behavior: smooth;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #08080c;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Navbar épurée en haut */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 3rem;
            width: 100%;
            position: absolute;
            top: 0;
            z-index: 10;
            background: linear-gradient(to bottom, rgba(8,8,12,0.8), transparent);
        }

        .nav-logo {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #fff;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: #9ca3af;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: color 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
        }

        .nav-links a:hover {
            color: #a855f7;
        }

        /* Hero Section avec l'image en fond */
        .hero {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background-image: url('logo.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            padding: 0 1rem;
        }

        .hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(8, 8, 12, 0.35);
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 45vh;
        }

        .cta-group {
            display: flex;
            gap: 1rem;
        }

        .btn {
            padding: 0.85rem 2.2rem;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background-color: #1F0063;
            color: #ffffff;
            border: 1px solid #7c3aed;
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.4);
        }

        .btn-primary:hover {
            background-color: #2e008a;
            border-color: #a855f7;
            box-shadow: 0 6px 25px rgba(168, 85, 247, 0.6);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background-color: rgba(15, 15, 25, 0.6);
            backdrop-filter: blur(10px);
            color: #d1d5db;
            border: 1px solid #374151;
        }

        .btn-secondary:hover {
            border-color: #a855f7;
            color: #ffffff;
            background-color: rgba(31, 0, 99, 0.3);
        }

        /* Section du Configurateur PC */
        #configurateur {
            padding: 6rem 2rem;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }

        .config-card {
            background: rgba(15, 15, 25, 0.85);
            border: 1px solid #374151;
            padding: 2.5rem;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .form-group {
            margin-bottom: 1.8rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.6rem;
            font-weight: 600;
            color: #e5e7eb;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        .form-group select {
            width: 100%;
            padding: 0.85rem;
            background: #08080c;
            color: #fff;
            border: 1px solid #4b5563;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .form-group select:focus {
            border-color: #a855f7;
        }

        .config-summary {
            border-top: 1px solid #374151;
            padding-top: 1.8rem;
            margin-top: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <header>

            <li><a href="#abonnements">Abonnements</a></li>
        </ul>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <div class="cta-group">

        </div>
    </section>

    <!-- Section Configurateur PC -->
    <section id="configurateur">

        <div class="config-card">
            
            <!-- Choix Processeur (CPU) -->
            <div class="form-group">
                <label for="select-cpu">Processeur (CPU)</label>
                <select id="select-cpu">
                    <option value="">-- Choisir un processeur --</option>
                </select>
            </div>

            <!-- Choix Carte Graphique (GPU) -->
            <div class="form-group">
                <label for="select-gpu">Carte Graphique (GPU)</label>
                <select id="select-gpu">
                    <option value="">-- Choisir une carte graphique --</option>
                </select>
            </div>

            <!-- Choix Mémoire RAM -->
            <div class="form-group">
                <label for="select-ram">Mémoire RAM</label>
                <select id="select-ram">
                    <option value="">-- Choisir de la RAM --</option>
                </select>
            </div>

            <!-- Résumé Prix et Puissance -->
            <div class="config-summary">
                <div>
                    <p style="font-size: 0.9rem; color: #9ca3af;">Consommation estimée : <span id="total-power" style="color: #fff; font-weight: bold;">0 W</span></p>
                </div>
                <div style="text-align: right;">
                    <span style="font-size: 0.85rem; color: #9ca3af; display: block; text-transform: uppercase; letter-spacing: 1px;">Total estimé</span>
                    <span id="total-price" style="font-size: 2rem; font-weight: 800; color: #a855f7;">0 €</span>
                </div>
            </div>

        </div>
    </section>

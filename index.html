<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ButterFix — Le comparateur de prix & Configurateur PC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #08080c;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Navbar épurée en haut */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 3rem;
            width: 100%;
            position: absolute;
            top: 0;
            z-index: 10;
            background: linear-gradient(to bottom, rgba(8,8,12,0.8), transparent);
        }

        .nav-logo {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #fff;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: #9ca3af;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: color 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .nav-links a:hover {
            color: #a855f7;
        }

        /* Hero Section avec ton image en arrière-plan */
        .hero {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background-image: url('logo.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            padding: 0 1rem;
        }

        /* Voile assombrissant léger pour garder le contraste */
        .hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(8, 8, 12, 0.35);
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 45vh; /* Ajuste la position verticale des boutons sous le logo de l'image */
        }

        /* CTA / Boutons d'action */
        .cta-group {
            display: flex;
            gap: 1rem;
        }

        .btn {
            padding: 0.85rem 2.2rem;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background-color: #1F0063;
            color: #ffffff;
            border: 1px solid #7c3aed;
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.4);
        }

        .btn-primary:hover {
            background-color: #2e008a;
            border-color: #a855f7;
            box-shadow: 0 6px 25px rgba(168, 85, 247, 0.6);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background-color: rgba(15, 15, 25, 0.6);
            backdrop-filter: blur(10px);
            color: #d1d5db;
            border: 1px solid #374151;
        }

        .btn-secondary:hover {
            border-color: #a855f7;
            color: #ffffff;
            background-color: rgba(31, 0, 99, 0.3);
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <header>
        <a href="#" class="nav-logo">ButterFix</a>
        <ul class="nav-links">
            <li><a href="#configurateur">Configurateur</a></li>
            <li><a href="#comparateur">Comparateur</a></li>
            <li><a href="#abonnements">Abonnements</a></li>
        </ul>
    </header>

    <!-- Hero Section avec l'image en fond -->
    <section class="hero">
        <div class="hero-content">
            <div class="cta-group">
                <a href="#configurateur" class="btn btn-primary">Lancer le Configurateur</a>
                <a href="#comparateur" class="btn btn-secondary">Comparer les prix</a>
            </div>
        </div>
    </section>

</body>
</html>
